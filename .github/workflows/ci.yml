name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Prepare temporary build artifact
        run: |
          artifact="${RUNNER_TEMP}/${{ github.event.repository.name }}-${{ github.sha }}.tar.gz"
          paths=()
          for path in build packages apps backend frontend; do
            if [[ -e "${path}" ]]; then
              paths+=("${path}")
            fi
          done
          if (( ${#paths[@]} > 0 )); then
            tar --exclude=node_modules --exclude=.git -czf "${artifact}" "${paths[@]}"
          else
            tar --exclude=node_modules --exclude=.git -czf "${artifact}" .
          fi
          echo "BUILD_ARTIFACT=${artifact}" >> "${GITHUB_ENV}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-${{ github.sha }}"
          path: "${{ env.BUILD_ARTIFACT }}"
          retention-days: 7
