name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
      - name: Prepare temporary build artifact
        run: >-
          tar --exclude=node_modules --exclude=.git -czf "${RUNNER_TEMP}/${{
          github.event.repository.name }}-${{ github.sha }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-${{ github.sha }}"
          path: "${{ runner.temp }}/${{ github.event.repository.name }}-${{ github.sha }}.tar.gz"
          retention-days: 7
