server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location = /api {
		return 404;
	}

	location ^~ /api/ {
		return 404;
	}

	location = / {
		return 204;
	}

	location = /admin {
		return 308 /admin/;
	}

	location /admin/ {
		rewrite ^/admin/(.*)$ /$1 break;
		try_files $uri $uri/ /index.html;
	}
}
